version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: mcp-claw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp_claw_dev
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp -d mcp_claw_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: mcp-claw-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mcp-claw-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  minio_data:
